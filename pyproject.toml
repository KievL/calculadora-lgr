[project]
name = "calculadora-lgr"
version = "0.1.0"
description = "Calculadora de Sistemas de Controle (LGR, projeto de controladores e discretização) - DCA-3701 UFRN"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.63",
    "numpy>=2.0",
    "sympy>=1.14",
    "scipy>=1.13",
    "plotly>=7.0",
    "control>=0.10",
    "reportlab>=5.0.1",
    "matplotlib>=3.11.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
